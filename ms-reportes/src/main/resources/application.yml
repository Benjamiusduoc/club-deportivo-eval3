spring:
  application:
    name: ms-reportes
  profiles:
    active: dev

ms:
  socios:
    url: ${MS_SOCIOS_URL:http://localhost:8081}
  cuotas:
    url: ${MS_CUOTAS_URL:http://localhost:8082}
  reservas:
    url: ${MS_RESERVAS_URL:http://localhost:8083}
  asistencia:
    url: ${MS_ASISTENCIA_URL:http://localhost:8084}
  actividades:
    url: ${MS_ACTIVIDADES_URL:http://localhost:8085}
  instructores:
    url: ${MS_INSTRUCTORES_URL:http://localhost:8086}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/ms_reportes?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Santiago}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8090}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: ${PORT:8090}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
